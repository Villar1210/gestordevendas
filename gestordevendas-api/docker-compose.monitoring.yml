# Docker Compose para Monitoring - Fase 18
# Use com: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up

version: '3.9'

services:

  # ─── Prometheus (Time Series Database) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: deskcomm_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring_net

  # ─── Grafana (Visualization) ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: deskcomm_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Alertmanager (Alert Routing) ──────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: deskcomm_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring_net

  # ─── PostgreSQL Exporter ────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: deskcomm_postgres_exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://deskcomm:${POSTGRES_PASSWORD}@postgres:5432/ivillar_crm?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - monitoring_net
      - backend_net

  # ─── Redis Exporter ───────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis-exporter:latest
    container_name: deskcomm_redis_exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - monitoring_net
      - backend_net

  # ─── Node Exporter (System Metrics) ────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: deskcomm_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring_net
    cap_add:
      - SYS_TIME

  # ─── cAdvisor (Docker Metrics) ────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: deskcomm_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring_net

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring_net:
    driver: bridge
  backend_net:
    external: true
