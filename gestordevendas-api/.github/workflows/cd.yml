# CD Pipeline - Deploy Automático
# Deploy para staging e produção após merge em main

name: CD - Deploy Automático

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI - Tests & Validation"]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'

    environment:
      name: staging
      url: https://staging-api.ivillar.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/deskcomm
            git fetch origin
            git checkout origin/main

            # Build images
            docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml build

            # Run migrations
            docker-compose exec -T backend alembic upgrade head

            # Restart services
            docker-compose up -d

            # Health check
            sleep 10
            curl -f https://staging-api.ivillar.com.br/api/health || exit 1

      - name: Run smoke tests
        run: |
          pip install pytest requests
          pytest tests/smoke/ -v --base-url=https://staging-api.ivillar.com.br

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Staging deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment* ✅\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success()

    environment:
      name: production
      url: https://api.ivillar.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Deploy to Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/deskcomm

            # Criar backup antes de deploy
            mkdir -p /backups/pre-deploy
            docker exec deskcomm_postgres pg_dump -U deskcomm ivillar_crm \
              | gzip > /backups/pre-deploy/db_$(date +%Y%m%d_%H%M%S).sql.gz

            # Atualizar código
            git fetch origin
            git checkout origin/main

            # Build images
            docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml build --no-cache

            # Run migrations
            docker-compose exec -T backend alembic upgrade head

            # Restart services (com zero-downtime via nginx)
            docker-compose up -d

            # Health checks
            sleep 10
            curl -f https://api.ivillar.com.br/api/health || (
              echo "❌ Production health check failed"
              # Rollback
              git checkout HEAD~1
              docker-compose up -d
              exit 1
            )

      - name: Run production smoke tests
        run: |
          pip install pytest requests
          pytest tests/smoke/ -v --base-url=https://api.ivillar.com.br

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment* ✅\n*Version:* v${{ github.run_number }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Production deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment* ❌\n*Commit:* ${{ github.sha }}\n*Branch:* main"
                  }
                }
              ]
            }

  notify-final:
    name: Final Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Send summary to Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Deployment Pipeline Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Pipeline Summary*\n• Staging: ${{ needs.deploy-staging.result }}\n• Production: ${{ needs.deploy-production.result }}"
                  }
                }
              ]
            }
