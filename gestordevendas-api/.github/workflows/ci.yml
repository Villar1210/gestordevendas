# CI Pipeline - GitHub Actions
# Executar testes e validações em cada push

name: CI - Tests & Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ivillar_crm_test
          POSTGRES_USER: deskcomm
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://deskcomm:test_password@localhost:5432/ivillar_crm_test
          REDIS_URL: redis://localhost:6379
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://deskcomm:test_password@localhost:5432/ivillar_crm_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install flake8 black isort mypy

      - name: Run Black (code formatting)
        run: black --check app/

      - name: Run isort (import sorting)
        run: isort --check-only app/

      - name: Run Flake8 (linting)
        run: flake8 app/ --max-line-length=100 --count --statistics

      - name: Run MyPy (type checking)
        run: mypy app/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Bandit (security)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Check dependencies
        run: |
          pip install safety
          pip freeze | safety check --json || true
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  results:
    name: Test Results
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker-build]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

      - name: Report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const comment = `
            ## CI Results ✨

            | Check | Status |
            |-------|--------|
            | Tests | ${{ needs.test.result == 'success' ? '✅' : '❌' }} |
            | Lint | ${{ needs.lint.result == 'success' ? '✅' : '❌' }} |
            | Security | ${{ needs.security.result == 'success' ? '✅' : '❌' }} |
            | Docker Build | ${{ needs.docker-build.result == 'success' ? '✅' : '❌' }} |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
