# Prometheus Alert Rules

groups:
  - name: deskcomm_alerts
    interval: 30s

    rules:
      # ─── API & Backend ──────────────────────────────────────────────────

      - alert: HighErrorRate
        expr: |
          (sum(rate(errors_total[5m])) / sum(rate(http_requests_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro alta (>5%) nos últimos 5 minutos"
          description: "{{ $value | humanizePercentage }} de requisições retornando erro"

      - alert: CriticalErrorRate
        expr: |
          (sum(rate(errors_total[5m])) / sum(rate(http_requests_total[5m]))) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro crítica (>10%)"
          description: "{{ $value | humanizePercentage }} de requisições falhando!"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latência acima de 1s"
          description: "P95: {{ $value | humanizeDuration }}"

      - alert: CriticalLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "P95 latência acima de 5s (crítico!)"
          description: "P95: {{ $value | humanizeDuration }}"

      # ─── Database ───────────────────────────────────────────────────────

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, rate(database_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queries de banco lentas (P95 > 500ms)"
          description: "Table: {{ $labels.table }}, Operation: {{ $labels.operation }}"

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          database_connections_active > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pool de conexões do banco quase esgotado"
          description: "Conexões ativas: {{ $value }}"

      - alert: DatabaseDown
        expr: |
          up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL está DOWN!"
          description: "Banco de dados não está respondendo"

      # ─── Cache ──────────────────────────────────────────────────────────

      - alert: LowCacheHitRate
        expr: |
          cache_hit_rate_percent < 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de cache baixa (< 50%)"
          description: "Hit rate: {{ $value | humanizePercentage }}"

      - alert: RedisDown
        expr: |
          up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis está DOWN!"
          description: "Cache está indisponível"

      # ─── Infrastructure ─────────────────────────────────────────────────

      - alert: HighMemoryUsage
        expr: |
          (memory_usage_bytes / 1073741824) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memória alto (>3GB)"
          description: "Memória: {{ $value | humanize }}GB"

      - alert: CriticalMemoryUsage
        expr: |
          (memory_usage_bytes / 1073741824) > 6
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Uso de memória crítico (>6GB)"
          description: "Memória: {{ $value | humanize }}GB"

      - alert: HighCPUUsage
        expr: |
          node_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU alto (>80%)"
          description: "CPU: {{ $value | humanizePercentage }}"

      - alert: DiskSpaceRunningOut
        expr: |
          (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espaço em disco baixo (<10% livre)"
          description: "Disco: {{ $value | humanizePercentage }} livre"

      # ─── Application Health ────────────────────────────────────────────

      - alert: BackendDown
        expr: |
          up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend API está DOWN!"
          description: "API não está respondendo em /metrics"

      - alert: QueueTooLarge
        expr: |
          background_jobs_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fila de background jobs muito grande"
          description: "Queue size: {{ $value }} jobs"

      # ─── Business Logic ────────────────────────────────────────────────

      - alert: AuditLogFailures
        expr: |
          rate(audit_actions_total{result="error"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Falhas ao registrar auditorias"
          description: "Rate: {{ $value }} falhas/segundo"

      - alert: HighFailureRateForCriticalActions
        expr: |
          (rate(audit_actions_total{action="create_lead",result="error"}[5m]) /
           (rate(audit_actions_total{action="create_lead"}[5m]) + 0.0001)) > 0.1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Alta taxa de falha ao criar leads (>10%)"
          description: "Ação: {{ $labels.action }}"
